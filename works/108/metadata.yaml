lyrics:
  Magna et mirabilia sunt opera tua Domine.\\
  Quis non timebit te,\\
  et magnificabit nomen tuum?\\
  Omnes gentes venient\\
  et adorabunt in conspectu tuo.\\[1ex]
  (\bibleverse{Rev}(15:3,4))
