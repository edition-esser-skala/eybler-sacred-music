toe: |
  17 & – & In \A1, Eybler cancelled the original measure following bar 17,
           which would have ended the piece in C major.
           Instead, he added bars 18–31, which set the doxology to music
           and conclude with a plagal cadence in G,
           emphasizing the mixolydian mode of the piece. \\
