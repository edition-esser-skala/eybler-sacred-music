  –    & cl & \A1 contains an alternative part for
              two oboes instead of clarinets. \\
  102ff & – & In bars 102–109, the lyrics “alleluia” and “amen”
              are written alternatingly in S/T and A/B, respectively,
              while in bars 110–117, they are written in each voice.
              Here, these alternative lyrics are written throughout
              the final section. \\
