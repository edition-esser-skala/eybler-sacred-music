lyrics:
  Timebunt gentes nomen tuum Domine\\
  et omnes reges terrae gloriam tuam.\\
  Quoniam aedificavit Dominus Sion,\\
  et videbitur in maiestate sua.\\[1ex]
  (\bibleverse{Ps}(102/101:16–17))
