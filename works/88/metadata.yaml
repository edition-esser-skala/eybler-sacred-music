lyrics:
  Domine si observaveris iniquitates\\
  quis sustinebit?\\
  Sustinuit anima mea in verbo eius\\
  speravit anima mea in Domino.\\
  Quia apud Dominum misericordia\\
  et copiosa apud Deum redemptio.\\[1ex]
  (\bibleverse{Ps}(130/129:3-5,7))
